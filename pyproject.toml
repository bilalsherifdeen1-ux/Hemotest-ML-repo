[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "hemotest"
version = "1.0.0"
description = "Smartphone-based haemoglobin prediction via colorimetric ML — NeuroVitalis / EQUIDX AI"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Sherifdeen Bilal Olamilekan", email = "team@neurovitalis.ng"},
  {name = "NeuroVitalis Health Innovations — EQUIDX AI Biotech"},
]
requires-python = ">=3.10"
keywords = [
  "hemoglobin", "anaemia", "point-of-care", "Nigeria",
  "colorimetry", "machine-learning", "EQUIDX", "NeuroVitalis",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "opencv-python>=4.9",
  "Pillow>=10.3",
  "scipy>=1.13",
  "loguru>=0.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "joblib>=1.3",
  "typer>=0.12",
  "rich>=13.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
